# Secrets (wrangler secret put …): RESEND_API_KEY, CONTACT_TO,
# COMPOSE_PASSWORD, CONFIRM_SECRET, RESEND_AUDIENCE_ID, RESEND_FROM,
# MAIL_POSTAL_ADDRESS (empty string until they have a PO box).
#
# Generate passwords: openssl rand -base64 24
# Accepted on Free, confirmed at first deploy 2026-09-08.
#
# These limits are approximate, not caps. The binding counts per
# Cloudflare location and is eventually consistent, so a burst outruns
# the counter: 5/60s below let roughly 31 requests through in one window
# under 25-way parallelism. Treat them as friction, not enforcement.
# See ops.md for what actually holds the line.

name = "hotstuff-mail"
main = "src/worker.js"
compatibility_date = "2025-09-19"

[[ratelimits]]
name = "MAIL_IP"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "MAIL_EMAIL"
namespace_id = "1002"
simple = { limit = 1, period = 60 }

[[ratelimits]]
name = "SEND_IP"
namespace_id = "1003"
simple = { limit = 5, period = 60 }
