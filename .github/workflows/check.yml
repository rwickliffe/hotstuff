# Runs ./check on every push. Same command, same steps as running it locally,
# so a green tick here means exactly what a clean local run means.
name: check

on:
  push:
  pull_request:

# Nothing here writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ./check needs node for the two test suites. python3 for
      # tools/make-assets.py is already on the runner, and that script uses
      # only the standard library.
      # Deliberately not the version used for development. Pinning CI to LTS
      # means it catches runtime drift instead of hiding it - which is how the
      # first run of this workflow found a Node-version-dependent bug.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The type checker is the one step that needs an install. ./check skips
      # it with a note when it is absent, so this is what makes CI stricter
      # than a fresh clone rather than merely different from it.
      - run: npm ci

      - run: ./check
